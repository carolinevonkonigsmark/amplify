<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amplify</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
:root {
  --ink: #1a1f36;
  --ink-soft: #5a6178;
  --line: #e4e7f0;
  --paper: #f7f8fb;
  --card: #ffffff;
  --accent: #3d5af1;
  --accent-soft: #eaeefe;
  --green: #17a673;
  --green-soft: #e2f6ee;
  --amber: #d99a06;
  --amber-soft: #fdf3d7;
  --red: #d64550;
  --red-soft: #fdeaec;
  --purple: #7b5cf0;
  --dark-bg: #0b0d1e;
  --dark-card: #151833;
  --dark-line: #2b2f55;
  --dark-text: #e8eaf6;
  --dark-muted: #8b90b5;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  color: var(--ink);
  background: var(--paper);
}

.app { min-height: 100vh; display: flex; flex-direction: column; }
.app-dark { background: var(--dark-bg); color: var(--dark-text); }
.app-light { background: var(--paper); color: var(--ink); }

/* ---------- Top nav ---------- */
.topnav {
  display: flex; align-items: center; gap: 20px;
  padding: 10px 22px;
  background: #0e1130;
  color: #fff;
  position: sticky; top: 0; z-index: 50;
}
.topnav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.brand-mark {
  background: linear-gradient(135deg, #5b6cff, #a45bf0);
  font-weight: 800; font-size: 12px; padding: 5px 8px; border-radius: 7px;
  letter-spacing: 0.5px;
}
.brand-name { font-weight: 700; font-size: 14px; white-space: nowrap; }
.topnav-links { display: flex; gap: 2px; flex: 1; overflow-x: auto; }
.topnav-link {
  background: none; border: none; color: #a3a9d6; font: inherit; font-size: 12.5px;
  padding: 7px 11px; border-radius: 7px; cursor: pointer; white-space: nowrap;
}
.topnav-link:hover { color: #fff; background: rgba(255,255,255,0.08); }
.topnav-link.active { color: #fff; background: rgba(91,108,255,0.35); font-weight: 600; }
.topnav-user { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.user-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, #35c3a9, #3d5af1);
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.user-name { color: #c9cdf0; white-space: nowrap; }
.user-badge {
  font-size: 9.5px; font-weight: 700; letter-spacing: 1px;
  background: #35c3a9; color: #06251d; padding: 3px 7px; border-radius: 20px;
}

.page { flex: 1; }

/* ---------- Shared light-page chrome ---------- */
.light-shell { display: flex; min-height: calc(100vh - 46px); }
.sidebar {
  width: 220px; flex-shrink: 0; border-right: 1px solid var(--line);
  background: var(--card); padding: 20px 14px;
}
.sidebar-title { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
.sidebar-logo {
  width: 30px; height: 30px; border-radius: 8px; color: #fff; font-weight: 800; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #3d5af1, #7b5cf0);
}
.sidebar-title h2 { font-size: 13.5px; }
.sidebar-sub { font-size: 10.5px; color: var(--ink-soft); margin: 2px 0 20px 39px; }
.sidebar-section { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; color: var(--ink-soft); margin: 18px 0 6px; }
.sidebar-item {
  display: block; width: 100%; text-align: left; background: none; border: none;
  font: inherit; font-size: 13px; color: var(--ink); padding: 8px 10px;
  border-radius: 8px; cursor: pointer;
}
.sidebar-item:hover { background: var(--paper); }
.sidebar-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sidebar-footer { margin-top: 30px; font-size: 11.5px; color: var(--ink-soft); }
.sidebar-footer a { display: block; color: var(--ink-soft); text-decoration: none; padding: 3px 0; cursor: pointer; }
.sidebar-footer a:hover { color: var(--accent); }

.content { flex: 1; padding: 26px 32px; max-width: 1200px; }
.content h1 { font-size: 21px; margin-bottom: 4px; }
.content-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 22px; }

/* ---------- Cards, chips, buttons ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.btn {
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 14px;
  border-radius: 8px; cursor: pointer;
}
.btn:hover { border-color: #c8cde0; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #2f49d1; }
.btn-danger-ghost { color: var(--red); border-color: #f0c6ca; }
.btn-sm { padding: 5px 10px; font-size: 11.5px; }
.btn:disabled { opacity: 0.45; cursor: default; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
}
.chip-green { background: var(--green-soft); color: var(--green); }
.chip-amber { background: var(--amber-soft); color: var(--amber); }
.chip-grey { background: #eef0f6; color: var(--ink-soft); }
.chip-purple { background: #f0ebfd; color: var(--purple); }
.chip-red { background: var(--red-soft); color: var(--red); }

/* ---------- Landing ---------- */
.landing {
  min-height: calc(100vh - 46px);
  background:
    radial-gradient(ellipse 60% 45% at 25% 85%, rgba(214,69,80,0.28), transparent),
    radial-gradient(ellipse 55% 45% at 78% 80%, rgba(123,92,240,0.4), transparent),
    radial-gradient(ellipse 70% 55% at 50% 25%, rgba(61,90,241,0.25), transparent),
    #0b0d24;
  color: #fff; padding: 48px 30px 60px; text-align: center;
  position: relative; overflow: hidden;
}
.landing h1 { font-size: 46px; font-weight: 600; margin-bottom: 14px; }
.landing-kicker { font-size: 12px; font-weight: 700; letter-spacing: 3px; color: #9aa8f5; margin-bottom: 34px; }
.signal-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 60px; }
.signal-pill {
  border: 1px solid rgba(255,255,255,0.35); border-radius: 12px;
  padding: 13px 34px; font-weight: 700; font-size: 14.5px;
  background: rgba(255,255,255,0.04); backdrop-filter: blur(4px);
}
.layer-row { display: flex; gap: 26px; justify-content: center; flex-wrap: wrap; }
.layer-card {
  width: 265px; text-align: left; border-radius: 18px; padding: 26px 22px;
  background: rgba(8,10,30,0.75);
  border: 1px solid rgba(123,92,240,0.55);
  box-shadow: 0 0 40px rgba(123,92,240,0.25);
  cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
}
.layer-card:hover { transform: translateY(-4px); box-shadow: 0 0 55px rgba(123,92,240,0.45); }
.layer-card.pulse-card { border-color: rgba(214,69,80,0.6); box-shadow: 0 0 40px rgba(214,69,80,0.2); }
.layer-icon { font-size: 34px; margin-bottom: 16px; }
.layer-card h3 { font-size: 17px; margin-bottom: 8px; }
.layer-tag { font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; color: #9aa8f5; margin-bottom: 12px; }
.layer-card p { font-size: 13px; line-height: 1.55; color: #c5c9e8; }
.landing-hint { margin-top: 44px; font-size: 12.5px; color: #8b90b5; }
.arch-flow {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin-top: 46px; flex-wrap: wrap;
}
.arch-node {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  border: 1px solid rgba(154,168,245,0.4); border-radius: 10px;
  padding: 12px 20px; font-size: 13.5px; font-weight: 700; color: #e8eaf6;
  background: rgba(255,255,255,0.03);
}
.arch-node small { font-size: 10px; font-weight: 500; color: #9aa8f5; letter-spacing: 0.3px; }
.arch-node-accent { border-color: rgba(123,92,240,0.7); box-shadow: 0 0 22px rgba(123,92,240,0.3); }
.arch-arrow { font-size: 18px; color: #6d7098; }

/* ---------- Security Pulse ---------- */
.context-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
.context-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 13px 14px; cursor: pointer; text-align: left; font: inherit;
}
.context-card .cc-icon { font-size: 15px; margin-bottom: 7px; display: block; }
.context-card h4 { font-size: 12.5px; margin-bottom: 4px; }
.context-card p { font-size: 10.5px; color: var(--ink-soft); line-height: 1.45; }
.context-card.selected { background: var(--accent); border-color: var(--accent); }
.context-card.selected h4, .context-card.selected p, .context-card.selected .cc-icon { color: #fff; }

.tab-row { display: inline-flex; background: #eef0f6; border-radius: 9px; padding: 3px; margin-bottom: 18px; }
.tab-row button {
  border: none; background: none; font: inherit; font-size: 12.5px; font-weight: 600;
  padding: 7px 16px; border-radius: 7px; cursor: pointer; color: var(--ink-soft);
}
.tab-row button.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(20,25,60,0.12); }

.pulse-grid { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }

.scatter-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.scatter-head h3 { font-size: 14.5px; }
.scatter-sub { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  border: none; background: var(--card); font: inherit; font-size: 11.5px; font-weight: 600;
  padding: 6px 12px; cursor: pointer; color: var(--ink-soft);
}
.seg button.active { background: var(--ink); color: #fff; }

.quad-legend { display: flex; flex-direction: column; gap: 12px; }
.quad-item { display: flex; gap: 9px; font-size: 11px; color: var(--ink-soft); line-height: 1.45; }
.quad-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 3px; flex-shrink: 0; }
.quad-item b { color: var(--ink); font-size: 11.5px; }
.analyst-note {
  margin-top: 16px; background: #f0ebfd; border: 1px solid #ddd2f8; border-radius: 10px;
  padding: 13px; font-size: 11.5px; line-height: 1.55; color: #4a3d80;
}
.analyst-note h5 { font-size: 10px; letter-spacing: 1.2px; margin-bottom: 7px; color: var(--purple); }

/* risk matrix */
.matrix-controls { display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 12px; }
.matrix-controls label { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--ink-soft); align-self: center; }
.matrix-controls select {
  font: inherit; font-size: 12px; padding: 6px 8px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--card);
}
table.matrix { width: 100%; border-collapse: separate; border-spacing: 4px 4px; }
table.matrix th {
  font-size: 10.5px; letter-spacing: 0.8px; color: var(--ink-soft); font-weight: 700;
  text-align: center; padding: 6px 4px; text-transform: uppercase;
}
table.matrix th.rowhead { text-align: left; }
table.matrix td { padding: 0; }
table.matrix td.rowlabel { font-size: 12.5px; font-weight: 600; padding-right: 10px; white-space: nowrap; }
table.matrix td.rowlabel span { font-weight: 400; font-size: 10.5px; color: var(--ink-soft); margin-left: 6px; }
.heat {
  display: block; text-align: center; font-size: 12.5px; font-weight: 600;
  padding: 10px 0; border-radius: 7px; border: 1px solid rgba(0,0,0,0.06);
}

/* ---------- Admin catalog ---------- */
.catalog-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-pill {
  border: 1px solid var(--line); background: var(--card); font: inherit; font-size: 11.5px;
  font-weight: 600; padding: 5px 12px; border-radius: 20px; cursor: pointer; color: var(--ink-soft);
}
.filter-pill.active { background: var(--ink); border-color: var(--ink); color: #fff; }
.filter-gap { width: 14px; }
.module-row {
  display: flex; justify-content: space-between; align-items: center; gap: 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 11px;
  padding: 14px 16px; margin-bottom: 10px;
}
.module-info h4 { font-size: 13.5px; display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.module-meta { font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
.module-meta code {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; background: #eef0f6;
  padding: 2px 6px; border-radius: 5px; margin-right: 8px;
}
.module-desc { font-size: 11.5px; color: var(--ink-soft); }
.module-actions { display: flex; gap: 7px; flex-shrink: 0; }

/* ---------- Orchestrator ---------- */
.orch-grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
.orch-step { margin-bottom: 16px; }
.orch-step h4 { font-size: 10.5px; letter-spacing: 1.3px; color: var(--ink-soft); margin-bottom: 10px; }
.orch-step textarea {
  width: 100%; font: inherit; font-size: 12px; padding: 10px; border-radius: 9px;
  border: 1px solid var(--line); resize: vertical; min-height: 74px;
  font-family: 'JetBrains Mono', monospace; color: var(--accent);
}
.pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
.pill-row .filter-pill.small { font-size: 11px; padding: 4px 11px; }
.format-opt {
  display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line);
  border-radius: 10px; padding: 11px 12px; margin-bottom: 8px; cursor: pointer;
  background: var(--card);
}
.format-opt.checked { border-color: var(--accent); background: var(--accent-soft); }
.format-opt input { margin-top: 3px; }
.format-opt h5 { font-size: 12.5px; margin-bottom: 3px; }
.format-opt p { font-size: 11px; color: var(--ink-soft); line-height: 1.45; }
.empty-state { text-align: center; color: var(--ink-soft); padding: 90px 20px; font-size: 12.5px; }
.empty-state .es-icon { font-size: 30px; margin-bottom: 12px; opacity: 0.5; }
.gen-result { margin-bottom: 14px; }
.gen-result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.gen-result-head h4 { font-size: 13px; display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.gen-quote {
  border-left: 3px solid var(--line); padding: 8px 12px; font-size: 12px;
  color: var(--ink-soft); font-style: italic; margin-bottom: 10px; line-height: 1.5;
}
.gen-url {
  display: flex; gap: 8px; margin-bottom: 10px;
}
.gen-url code {
  flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 10px; background: #eef0f6;
  padding: 8px 10px; border-radius: 7px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; color: var(--ink-soft);
}
.big-cta { display: block; width: 100%; text-align: center; margin-bottom: 8px; padding: 11px; font-size: 13px; }
.spin {
  width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
  border-radius: 50%; display: inline-block; vertical-align: -3px; margin-right: 8px;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.inferred-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

/* ---------- Command centre ---------- */
.wizard-steps { display: flex; gap: 8px; margin-bottom: 24px; }
.wstep {
  flex: 1; text-align: center; font-size: 12.5px; font-weight: 600; padding: 10px;
  border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
}
.wstep.done { background: var(--green-soft); border-color: #bfe8d8; color: var(--green); }
.wstep.current { background: #e7ebfd; border-color: #c3cdf8; color: var(--accent); }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.field .hint { font-size: 11px; color: var(--ink-soft); font-weight: 400; margin-bottom: 6px; }
.field input[type='text'], .field input[type='email'] {
  width: 100%; font: inherit; font-size: 13px; padding: 10px 12px;
  border-radius: 9px; border: 1px solid var(--line);
}
.audience-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.wizard-nav { display: flex; justify-content: space-between; margin-top: 22px; }
.compose-toolbar {
  display: flex; gap: 4px; border: 1px solid var(--line); border-bottom: none;
  border-radius: 9px 9px 0 0; padding: 7px 9px; background: #fafbfe;
}
.compose-toolbar span {
  font-size: 11px; font-weight: 700; color: var(--ink-soft); padding: 3px 7px;
  border-radius: 5px; cursor: default;
}
.compose-body {
  border: 1px solid var(--line); border-radius: 0 0 9px 9px; padding: 14px;
  font-size: 13px; line-height: 1.65; background: var(--card);
}
.compose-img {
  margin-top: 12px; border-radius: 9px; height: 130px;
  background: linear-gradient(140deg, #0d2136, #14496b 55%, #d97b28);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; letter-spacing: 1px; font-weight: 600;
}
.stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 18px; text-align: center; }
.stat-card .num { font-size: 26px; font-weight: 700; }
.stat-card .num.green { color: var(--green); }
.stat-card .lbl { font-size: 10px; letter-spacing: 1.2px; color: var(--ink-soft); font-weight: 700; margin-top: 5px; }
.donut-wrap { display: flex; gap: 24px; align-items: center; }
.campaign-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 30px; font-size: 12px; }
.campaign-info-grid div { color: var(--ink-soft); }
.campaign-info-grid b { color: var(--ink); font-weight: 600; }

/* ---------- Teams mock ---------- */
.teams { display: flex; min-height: calc(100vh - 46px); background: #f5f5f5; color: #242424; }
.teams-rail {
  width: 68px; background: #2b2b3d; padding: 14px 0; display: flex; flex-direction: column;
  align-items: center; gap: 6px; font-size: 10px; color: #c8c6d4;
}
.teams-rail .rail-logo {
  width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #6264a7, #464775);
  display: flex; align-items: center; justify-content: center; font-size: 15px; margin-bottom: 14px; color: #fff;
}
.rail-item { text-align: center; cursor: default; padding: 7px 8px; border-radius: 6px; width: 52px; }
.rail-item.active { background: rgba(255,255,255,0.09); color: #fff; }
.rail-item .ri-icon { font-size: 17px; display: block; margin-bottom: 3px; }
.teams-sidebar { width: 260px; background: #faf9f8; border-right: 1px solid #e1dfdd; padding: 14px 0; font-size: 13.5px; }
.teams-ws { font-weight: 800; font-size: 17px; padding: 0 16px 14px; color: #242424; }
.teams-section { padding: 4px 16px; color: #616161; font-size: 11.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; margin-top: 14px; }
.teams-chan { padding: 5px 16px 5px 24px; cursor: default; color: #424242; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.teams-chan.active { background: #e1dfea; color: #242424; border-left: 3px solid #6264a7; padding-left: 21px; font-weight: 600; }
.teams-main { flex: 1; display: flex; flex-direction: column; background: #fff; }
.teams-header {
  padding: 12px 20px; border-bottom: 1px solid #e1dfdd; font-weight: 700; color: #242424;
  display: flex; align-items: center; gap: 8px; font-size: 15px;
}
.teams-msgs { flex: 1; padding: 22px 26px; }
.teams-day {
  text-align: center; font-size: 11.5px; font-weight: 700; color: #616161;
  border-bottom: 1px solid #e1dfdd; line-height: 0.1; margin: 10px 0 26px;
}
.teams-day span { background: #fff; padding: 0 12px; }
.teams-msg { display: flex; gap: 10px; }
.teams-avatar {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, #6264a7, #464775);
  display: flex; align-items: center; justify-content: center; font-size: 19px; color: #fff;
}
.teams-msg-head { display: flex; align-items: baseline; gap: 7px; margin-bottom: 4px; }
.teams-msg-head b { color: #242424; font-size: 14px; }
.teams-app-badge { font-size: 9px; font-weight: 700; background: #f0eefa; color: #6264a7; padding: 2px 5px; border-radius: 3px; }
.teams-time { font-size: 11px; color: #8a8886; }
.teams-bubble {
  background: #f5f5f5; border-radius: 0 8px 8px 8px; padding: 12px 14px;
  font-size: 13.5px; line-height: 1.6; max-width: 620px; color: #242424;
}
.teams-bubble a { color: #6264a7; text-decoration: none; cursor: pointer; font-weight: 600; }
.teams-bubble a:hover { text-decoration: underline; }
.teams-img {
  margin-top: 12px; width: 420px; height: 200px; border-radius: 10px;
  background: linear-gradient(140deg, #2b2b3d, #464775 55%, #6264a7);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; letter-spacing: 1px; font-weight: 600;
}
.teams-composer {
  margin: 0 26px 24px; border: 1px solid #e1dfdd; border-radius: 10px; padding: 11px 14px;
  color: #8a8886; font-size: 13.5px; background: #fff;
}

/* ---------- Cipher Letter simulation ---------- */
.sim-shell { max-width: 900px; margin: 0 auto; padding: 26px 20px 60px; }
.sim-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.sim-topbar h2 { font-size: 15px; display: flex; gap: 10px; align-items: center; }
.attack-banner {
  background: var(--red); color: #fff; font-weight: 700; text-align: center;
  border-radius: 10px; padding: 13px; margin-bottom: 18px; font-size: 14.5px;
}
.mail-window {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 10px 34px rgba(20,25,60,0.10); overflow: hidden;
}
.mail-chrome { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.mail-logo { font-weight: 800; color: var(--purple); font-size: 15px; }
.mail-search {
  flex: 1; background: var(--paper); border-radius: 7px; padding: 7px 12px;
  font-size: 12px; color: var(--ink-soft);
}
.mail-body { display: flex; }
.mail-nav { width: 150px; border-right: 1px solid var(--line); padding: 14px 0; font-size: 12.5px; }
.mail-nav div { padding: 6px 16px; color: var(--ink-soft); display: flex; justify-content: space-between; }
.mail-nav div.active { color: var(--accent); font-weight: 700; background: var(--accent-soft); }
.mail-content { flex: 1; padding: 20px 24px; }
.mail-content h3 { font-size: 16.5px; margin-bottom: 14px; }
.mail-from { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
.mail-from-avatar {
  width: 36px; height: 36px; border-radius: 50%; background: #1e6e54; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
}
.mail-from b { font-size: 13px; display: block; }
.mail-from-addr {
  font-size: 11px; color: var(--ink-soft); background: #eef0f6; border-radius: 5px;
  padding: 2px 7px; display: inline-block; margin-top: 3px;
}
.mail-date { margin-left: auto; font-size: 11.5px; color: var(--ink-soft); }
.mail-text { font-size: 13px; line-height: 1.7; color: #333a52; margin-bottom: 20px; }
.mail-text code { font-family: 'JetBrains Mono', monospace; background: #eef0f6; padding: 1px 6px; border-radius: 4px; }
.choice {
  display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
  border: 1px solid var(--line); background: var(--card); border-radius: 10px;
  padding: 13px 15px; margin-bottom: 9px; font: inherit; font-size: 13px; cursor: pointer;
}
.choice:hover { border-color: var(--accent); background: var(--accent-soft); }
.choice .key {
  width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700;
  flex-shrink: 0; background: var(--paper);
}
.choice.picked-good { border-color: var(--green); background: var(--green-soft); }
.choice.picked-bad { border-color: var(--red); background: var(--red-soft); }
.sim-actions { display: flex; gap: 10px; justify-content: center; padding: 18px; border-top: 1px solid var(--line); }
.coach-box {
  margin: 0 18px 18px; border: 1px solid #d8dcf8; background: #f3f5fe; border-radius: 10px; padding: 14px 16px;
}
.coach-box h5 { font-size: 10.5px; letter-spacing: 1.2px; color: var(--accent); margin-bottom: 7px; }
.coach-box p { font-size: 12.5px; line-height: 1.6; color: #3c4370; }
.coach-rate { margin-top: 9px; display: flex; gap: 7px; }

.redflags { display: grid; grid-template-columns: 1fr 340px; gap: 18px; margin-top: 18px; align-items: start; }
.flag-item {
  display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line);
  border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; cursor: pointer; font-size: 12.5px;
  background: var(--card);
}
.flag-item.ticked { border-color: var(--red); background: var(--red-soft); }
.flag-item input { margin-top: 2px; }

.persona-quad { max-width: 620px; margin: 26px auto; text-align: center; }
.persona-grid {
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 150px 150px;
  gap: 4px; position: relative; margin: 18px 0 8px;
}
.pq-cell { border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 700; }
.pq-cell span { font-size: 24px; }
.pq-you {
  position: absolute; width: 46px; height: 46px; border-radius: 50%;
  background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 800; border: 3px solid #fff; box-shadow: 0 4px 14px rgba(214,69,80,0.5);
}
.pq-axis { font-size: 10.5px; color: var(--ink-soft); display: flex; justify-content: space-between; padding: 0 20px; }
.persona-result {
  margin-top: 18px; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 18px; text-align: left; font-size: 13px; line-height: 1.6;
}

/* ---------- Ampliverse ---------- */
.amplify-shell { display: flex; min-height: calc(100vh - 46px); }
.amplify-side { width: 215px; background: #0d1028; border-right: 1px solid var(--dark-line); padding: 20px 14px; }
.amplify-side .as-brand { color: #f2b64c; font-weight: 800; font-size: 12.5px; letter-spacing: 1.5px; margin-bottom: 22px; }
.amplify-side .sidebar-section { color: #5c6191; }
.amplify-item {
  display: block; width: 100%; text-align: left; background: none; border: none; font: inherit;
  font-size: 13px; color: #b7bce0; padding: 8px 10px; border-radius: 8px; cursor: pointer;
}
.amplify-item:hover { background: rgba(255,255,255,0.06); }
.amplify-item.active { background: rgba(53,195,169,0.18); color: #35c3a9; font-weight: 600; }
.amplify-main { flex: 1; padding: 26px 32px; position: relative; }
.welcome-hero {
  background: linear-gradient(120deg, rgba(53,195,169,0.85), rgba(23,97,131,0.75));
  border-radius: 14px; padding: 26px 28px; margin-bottom: 26px; color: #fff;
}
.welcome-hero h1 { font-size: 22px; margin-bottom: 8px; }
.welcome-hero p { font-size: 13px; opacity: 0.9; max-width: 560px; line-height: 1.55; }
.avail-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.avail-head h4 { font-size: 10.5px; letter-spacing: 1.5px; color: var(--dark-muted); }
.avail-head span { font-size: 11.5px; color: var(--dark-muted); }
.collection-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.ctab {
  border: 1px solid var(--dark-line); background: none; color: var(--dark-muted); font: inherit;
  font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; padding: 6px 13px;
  border-radius: 20px; cursor: pointer;
}
.ctab.active { background: #35c3a9; border-color: #35c3a9; color: #04211a; }
.mod-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.mod-card { background: var(--dark-card); border: 1px solid var(--dark-line); border-radius: 12px; padding: 16px; }
.mod-card .tag { font-size: 9.5px; font-weight: 800; letter-spacing: 1.4px; color: #35c3a9; margin-bottom: 9px; display: block; }
.mod-card h4 { font-size: 14px; margin-bottom: 7px; color: #fff; }
.mod-card p { font-size: 11.5px; color: var(--dark-muted); line-height: 1.5; margin-bottom: 14px; }
.mod-card-foot { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--dark-muted); }
.mod-card-foot button { background: none; border: none; color: #35c3a9; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.galaxy-toggle { position: absolute; top: 26px; right: 32px; display: flex; gap: 8px; align-items: center; }

.galaxy {
  position: relative; height: calc(100vh - 46px); overflow: hidden;
  background: radial-gradient(ellipse at 60% 40%, #191d3f 0%, #0b0d1e 60%, #06070f 100%);
}
.star { position: absolute; border-radius: 50%; background: #cdd3ff; }
.star-big {
  background: #fff; border-radius: 50%;
  box-shadow: 0 0 6px 2px rgba(255,255,255,0.55), 0 0 14px 4px rgba(180,190,255,0.25);
  animation-name: star-twinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite;
}
@keyframes star-twinkle {
  0%, 100% { opacity: 0.45; transform: scale(0.85); }
  50% { opacity: 1; transform: scale(1.35); }
}

/* nebula + comet ambience */
.nebula { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.35; z-index: 1; pointer-events: none; }
.nebula-a { width: 380px; height: 300px; left: 8%; top: 10%; background: radial-gradient(circle, #6d3fd6, transparent 70%); }
.nebula-b { width: 320px; height: 280px; right: 6%; bottom: 6%; background: radial-gradient(circle, #1f7a9c, transparent 70%); }
.comet {
  position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 6px 1px #fff, -80px 20px 18px 2px rgba(255,255,255,0.35);
  opacity: 0; z-index: 2; animation: comet-fly 9s linear infinite;
}
.comet-a { top: 14%; left: -5%; animation-delay: 1s; }
.comet-b { top: 60%; left: -5%; animation-delay: 5.5s; }
@keyframes comet-fly {
  0% { transform: translate(0, 0); opacity: 0; }
  4% { opacity: 1; }
  22% { transform: translate(60vw, 26vh); opacity: 0; }
  100% { transform: translate(60vw, 26vh); opacity: 0; }
}

.galaxy-hud {
  position: absolute; top: 0; left: 0; right: 0; padding: 14px 24px 8px;
  display: flex; align-items: center; gap: 22px; z-index: 5; flex-wrap: wrap;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.5px;
}
.galaxy-hud .hud-brand { color: #f2994a; font-weight: 700; }
.galaxy-hud .hud-tab { color: #6d7098; }
.galaxy-hud .hud-tab.on { color: #e8eaf6; background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 5px; }
.galaxy-hud .hud-streak {
  margin-left: auto; color: #ff9d5c; font-weight: 700; background: rgba(255,157,92,0.12);
  padding: 4px 10px; border-radius: 5px;
}
.galaxy-subbar {
  position: absolute; top: 46px; left: 24px; right: 24px; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1px;
}
.galaxy-level-badge {
  color: #0b0d1e; background: linear-gradient(120deg, #f2b64c, #ff9d5c);
  font-weight: 800; padding: 3px 10px; border-radius: 20px; letter-spacing: 1px; white-space: nowrap;
}
.galaxy-xpbar { width: 160px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
.galaxy-xpbar-fill { height: 100%; background: linear-gradient(90deg, #f2994a, #f2b64c); border-radius: 4px; }
.galaxy-xp-label { color: #8b90b5; }

.planet-wrap { position: absolute; text-align: center; cursor: pointer; z-index: 4; }
.planet-wrap.locked { cursor: pointer; opacity: 0.85; }
.orbit-ring {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  border: 1px dashed rgba(255,255,255,0.12); border-radius: 50%; z-index: -1;
}
.planet { border-radius: 50%; margin: 0 auto; position: relative; z-index: 1; }
.planet-ring {
  position: absolute; inset: -14px; border: 1px solid rgba(255,255,255,0.35);
  border-radius: 50%; overflow: visible;
}
.planet-ring-belt {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-16deg);
  border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; z-index: 0; pointer-events: none;
}
.crater { position: absolute; border-radius: 50%; background: rgba(0,0,0,0.28); }
.planet-shine {
  position: absolute; top: 8%; left: 14%; width: 42%; height: 30%; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.35), transparent 70%);
}
.planet-clouds {
  position: absolute; inset: 0; border-radius: 50%; opacity: 0.5;
  background:
    radial-gradient(ellipse 26px 9px at 30% 70%, rgba(255,255,255,0.55), transparent 70%),
    radial-gradient(ellipse 20px 8px at 65% 35%, rgba(255,255,255,0.4), transparent 70%);
}
.moon {
  position: absolute; width: 8px; height: 8px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #d7dbf5, #8b90b5);
  animation: moon-bob 5s ease-in-out infinite;
}
@keyframes moon-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.planet-lock {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 15px; opacity: 0.8;
}
.planet-cleared {
  position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%;
  background: #35c3a9; color: #0b0d1e; font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(53,195,169,0.7);
}
.planet-label {
  margin-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
  letter-spacing: 2px; font-weight: 700;
}
.planet-progress { width: 46px; height: 3px; margin: 5px auto 0; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; }
.planet-progress-fill { height: 100%; border-radius: 3px; }

/* gamified side panels: missions / achievements / leaderboard */
.panel-grid {
  position: absolute; top: 96px; left: 40px; right: 40px; bottom: 110px; z-index: 5;
  overflow-y: auto; max-width: 640px;
}
.panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.panel-head h3 {
  font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 2px; color: #e8eaf6;
}
.panel-sub { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #8b90b5; }

.quest-card {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 8px;
  background: rgba(21,24,51,0.75); border: 1px solid var(--dark-line); border-radius: 10px;
  backdrop-filter: blur(3px);
}
.quest-card.done { opacity: 0.55; }
.quest-card.locked { opacity: 0.45; }
.quest-icon { font-size: 20px; flex-shrink: 0; }
.quest-body { flex: 1; min-width: 0; }
.quest-title { font-size: 12.5px; color: #e8eaf6; }
.quest-progress { width: 100%; height: 4px; margin-top: 6px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
.quest-progress-fill { height: 100%; background: linear-gradient(90deg, #ff9d5c, #f2b64c); border-radius: 4px; }
.quest-xp { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #f2b64c; font-weight: 700; flex-shrink: 0; }
.quest-status { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 1px; padding: 3px 8px; border-radius: 20px; flex-shrink: 0; }
.quest-status.done { background: rgba(53,195,169,0.18); color: #35c3a9; }
.quest-status.active { background: rgba(242,182,76,0.18); color: #f2b64c; }
.quest-status.locked { background: rgba(139,144,181,0.15); color: #8b90b5; }

.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.badge-card {
  background: rgba(21,24,51,0.75); border: 1px solid var(--dark-line); border-radius: 12px;
  padding: 16px 12px; text-align: center; backdrop-filter: blur(3px);
}
.badge-card.locked { opacity: 0.4; }
.badge-card.earned { border-color: rgba(242,182,76,0.45); box-shadow: 0 0 16px rgba(242,182,76,0.12); }
.badge-icon { font-size: 26px; margin-bottom: 8px; }
.badge-title { font-size: 11.5px; font-weight: 700; color: #e8eaf6; margin-bottom: 4px; }
.badge-desc { font-size: 10px; color: #8b90b5; line-height: 1.4; }

.lb-row {
  display: flex; align-items: center; gap: 12px; padding: 9px 14px; margin-bottom: 6px;
  background: rgba(21,24,51,0.75); border: 1px solid var(--dark-line); border-radius: 10px;
  backdrop-filter: blur(3px);
}
.lb-row.you { border-color: rgba(242,182,76,0.5); background: rgba(242,182,76,0.08); }
.lb-rank { width: 26px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8b90b5; flex-shrink: 0; text-align: center; }
.lb-avatar {
  width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #6264a7, #464775);
  color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.lb-name { font-size: 12.5px; color: #e8eaf6; width: 150px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-bar { flex: 1; height: 5px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
.lb-bar-fill { height: 100%; background: linear-gradient(90deg, #f2994a, #f2b64c); border-radius: 4px; }
.lb-xp { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #f2b64c; font-weight: 700; width: 78px; text-align: right; flex-shrink: 0; }

.mission-locked {
  font-size: 11px; line-height: 1.7; color: #8b90b5; letter-spacing: 0.5px;
}
.mission-locked b { color: #f2b64c; }

.mission-panel {
  position: absolute; top: 96px; right: 40px; width: 300px; z-index: 6;
  border: 1px solid rgba(242,182,76,0.5); background: rgba(10,10,22,0.88);
  border-radius: 4px; padding: 20px; font-family: 'JetBrains Mono', monospace;
  color: #f2b64c; backdrop-filter: blur(4px);
}
.mission-panel h3 { font-size: 15px; letter-spacing: 3px; margin-bottom: 16px; }
.mission-stats { display: flex; justify-content: space-between; margin-bottom: 16px; text-align: center; }
.mission-stats .ms { font-size: 19px; font-weight: 700; }
.mission-stats .ms small { display: block; font-size: 8px; letter-spacing: 1px; color: #8a7346; margin-top: 4px; }
.mission-mods { list-style: none; margin-bottom: 16px; }
.mission-mods li { font-size: 10px; letter-spacing: 1px; padding: 4px 0; color: #d8b676; }
.mission-mods li::before { content: '◉ '; color: #f2994a; }
.mission-launch {
  display: block; width: 100%; background: #f2b64c; border: none; color: #241a05;
  font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 2px;
  padding: 11px; cursor: pointer; border-radius: 3px;
}
.mission-launch:hover { background: #ffca66; }
.mascot { position: absolute; left: 30px; bottom: 24px; display: flex; gap: 14px; align-items: flex-end; z-index: 6; }
.mascot-sprite {
  width: 86px; height: 86px; border-radius: 50%; font-size: 46px;
  background: radial-gradient(circle at 35% 30%, #ff9d5c, #d64550);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 34px rgba(255,140,80,0.55);
  animation: mascot-bob 3.2s ease-in-out infinite;
}
@keyframes mascot-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.robot-face { display: block; overflow: visible; }
.robot-eyes { animation: robot-blink 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes robot-blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.12); } }
.robot-antenna-dot {
  transform-box: fill-box; transform-origin: center;
  animation: robot-pulse 1.7s ease-in-out infinite;
}
@keyframes robot-pulse { 0%, 100% { transform: scale(1); opacity: 0.75; } 50% { transform: scale(1.3); opacity: 1; } }
.mascot-say {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #c9b28a;
  line-height: 1.7; letter-spacing: 0.5px; max-width: 260px; padding-bottom: 6px;
}
.mascot-say b { color: #f2994a; }

/* linkedin sim modal */
.modal-back {
  position: fixed; inset: 0; background: rgba(4,5,15,0.72); z-index: 90;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.li-card {
  background: #f4f2ee; color: #1a1f36; width: 620px; max-width: 100%; border-radius: 12px;
  overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,0.6);
}
.li-chrome { background: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #e0ddd7; }
.li-logo { background: #0a66c2; color: #fff; font-weight: 800; width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.li-body { padding: 20px 24px; max-height: 68vh; overflow-y: auto; }
.li-banner { height: 64px; border-radius: 8px 8px 0 0; background: linear-gradient(120deg, #90b8d8, #37699b); }

function levelInfo(xp) {
  let idx = 0
  for (let i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i].min) idx = i
  const cur = LEVELS[idx]
  const next = LEVELS[idx + 1]
  const pct = next ? Math.round(((xp - cur.min) / (next.min - cur.min)) * 100) : 100
  return { idx, name: cur.name, next: next?.name, toNext: next ? next.min - xp : 0, pct }
}

                <div className="lb-bar"><div className="lb-bar-fill" style={{ width: `${Math.round((r.xp / LEADERBOARD[0].xp) * 100)}%` }} /></div>
                <span className="lb-xp">{r.xp.toLocaleString()} XP</span>
              </div>
            ))}
          </div>
        )}

        <div className="mascot">
          <div className="mascot-sprite"><RoboFace size={54} /></div>
          <div className="mascot-say">
            <b>» Amplify</b><br />
            {mascotLine}
          </div>
        </div>

        {vendor && (
          <VendorSim
            outcome={vendorOutcome}
            setOutcome={setVendorOutcome}
            close={() => { setVendor(false); setVendorOutcome(null) }}
          />
        )}
      </div>
    )
  }

  const shown = MODULES.filter((m) => m.coll === collTab)

  return (
    <div className="amplify-shell">
      <aside className="amplify-side">
        <div className="as-brand">✦ THE AMPLIVERSE</div>
        <div className="sidebar-section">LEARNER</div>
        <button className="amplify-item active">🏠 Home</button>
        <button className="amplify-item">▦ Modules</button>
        <div className="sidebar-section">QUICK LINKS</div>
        <button className="amplify-item">💬 Ask Amplify</button>
        <button className="amplify-item">🧰 Approved AI Tools</button>
        <button className="amplify-item">🧱 Stacks 4 Hacks</button>
        <div className="sidebar-section">ADMIN</div>
        <button className="amplify-item" onClick={() => onNavigate('catalog')}>⚙ Admin</button>
      </aside>

      <div className="amplify-main">
        <div className="galaxy-toggle">
          <span style={{ fontSize: 11, color: 'var(--dark-muted)' }}>v2 classic</span>
          <button className="btn btn-sm btn-primary" onClick={() => setView('galaxy')}>🪐 Switch to v3 Galaxy Map</button>
        </div>

        <div className="welcome-hero">
          <h1>Welcome, Caroline von Konigsmark.</h1>
          <p>Pick a module below to get started. Your progress is saved as you go, and your submissions stay private to you and your admins.</p>
        </div>

        <div className="avail-head">
          <h4>AVAILABLE MODULES</h4>
          <span>8 available</span>
        </div>
        <div className="collection-tabs">
          {['PROMPT LAB', 'AGENT HARBOR', 'SIMULATIONS', 'OTHER'].map((c) => (
            <button key={c} className={`ctab ${collTab === c ? 'active' : ''}`} onClick={() => setCollTab(c)}>{c}</button>
          ))}
        </div>
        <div className="mod-cards">
          {shown.map((m, i) => (
            <div className="mod-card" key={i}>
              <span className="tag">{m.tag}</span>
              <h4>{m.title}</h4>
              <p>{m.desc}</p>
              <div className="mod-card-foot">
                <span>Updated {m.updated}</span>
                <button onClick={() => (m.target === 'cipher' ? onNavigate('cipher') : setVendor(true))}>Open →</button>
              </div>
            </div>
          ))}
        </div>

        {vendor && (
          <VendorSim
            outcome={vendorOutcome}
            setOutcome={setVendorOutcome}
            close={() => { setVendor(false); setVendorOutcome(null) }}
          />
        )}
      </div>
    </div>
  )
}

function VendorSim({ outcome, setOutcome, close }) {
  return (
    <div className="modal-back" onClick={close}>
      <div className="li-card" onClick={(e) => e.stopPropagation()}>
        <div className="li-chrome">
          <div className="li-logo">in</div>
          <span style={{ fontSize: 12, color: '#8a8d92' }}>Search</span>
          <span style={{ flex: 1 }} />
          <span style={{ fontSize: 11.5, color: '#8a8d92' }}>Home · My Network · Messaging · Notifications</span>
          <button onClick={close} style={{ border: 'none', background: '#0a66c2', color: '#fff', borderRadius: '50%', width: 22, height: 22, cursor: 'pointer' }}>✕</button>
        </div>
        <div className="li-body">
          <div className="li-banner" />
          <div className="li-profile">
            <div className="li-avatar" style={{ background: 'linear-gradient(135deg, #7b5cf0, #3d5af1)' }}>NA</div>
            <h3>NovaAI Tools</h3>
            <div className="li-role">"SummarizeGPT — your meetings, summarized. 100% free forever."</div>
            <div className="li-loc">Software company · 11–50 employees</div>
            <div className="li-stats">
              <span><b>2,4k</b> Followers</span>
              <span><b>8</b> Posts</span>
              <span><b>3 mo</b> Page age</span>
            </div>
          </div>
          <div className="li-section">
            <h4>Sponsored message</h4>
            <p>
              Hi Caroline! 👋 Loved your post about meeting overload. SummarizeGPT gives you instant AI
              summaries of every meeting — completely free. Just connect your Google Drive and calendar and
              we handle the rest. Setup takes 30 seconds — no IT approval needed!
            </p>
          </div>
          <div className="li-section">
            <h4>What to weigh</h4>
            <ul style={{ paddingLeft: 18 }}>
              <li>"Free forever" + full Drive access — what's the business model?</li>
              <li>3-month-old company page, no security or privacy documentation</li>
              <li>"No IT approval needed" is a pitch aimed at bypassing your tool-intake process</li>
              <li>Your org already has an approved meeting-summary workflow</li>
            </ul>
          </div>
        </div>
        {outcome && (
          <div className={`li-feedback ${outcome === 'report' ? 'good' : 'bad'}`}>
            {outcome === 'report' ? (
              <><b>✓ Best move.</b> Submitting the tool for vetting keeps the door open — if it's legit, IT can approve it for everyone; if not, you just prevented an org-wide Drive exposure. Enablement means more AI, through the right door.</>
            ) : outcome === 'connect' ? (
              <><b>✗ Risky.</b> Connecting Drive grants a 3-month-old unvetted vendor access to everything you can see. "Free forever" usually means your data is the product. Route it through tool intake instead — approval often takes days, not months.</>
            ) : (
              <><b>△ Understandable.</b> Ignoring it protects you, but colleagues got the same pitch. Submitting it for vetting (30 seconds) protects the whole org — and if the tool is good, everyone gets it properly.</>
            )}
          </div>
        )}
        <div className="li-actions">
          <button className="li-btn primary" onClick={() => setOutcome('connect')}>Connect Google Drive</button>
          <button className="li-btn ghost" onClick={() => setOutcome('ignore')}>Ignore</button>
          <button className="li-btn report" onClick={() => setOutcome('report')}>Submit for Vetting</button>
        </div>
      </div>
    </div>
  )
}

return Ampliverse;
})();

const App = (() => {
const { useState, useMemo, useEffect, useRef } = React;

const PAGES = [
  { id: 'landing', label: 'Overview' },
  { id: 'pulse', label: 'AI Pulse' },
  { id: 'catalog', label: 'Module Catalog' },
  { id: 'orchestrator', label: 'Scenario Orchestrator' },
  { id: 'command', label: 'Amplify Command Centre' },
  { id: 'teams', label: 'Teams Delivery' },
  { id: 'cipher', label: 'Prompt Lab' },
  { id: 'ampliverse', label: 'The Ampliverse' },
]

function App() {
  const [page, setPage] = useState('landing')
  // shared state: campaign generated by the orchestrator flows into command centre + teams
  const [campaign, setCampaign] = useState(null)

  const darkPages = ['landing', 'ampliverse']

  return (
    <div className={`app ${darkPages.includes(page) ? 'app-dark' : 'app-light'}`}>
      <nav className="topnav">
        <div className="topnav-brand" onClick={() => setPage('landing')}>
          <span className="brand-mark">AMP</span>
          <span className="brand-name">Amplify</span>
        </div>
        <div className="topnav-links">
          {PAGES.map((p) => (
            <button
              key={p.id}
              className={`topnav-link ${page === p.id ? 'active' : ''}`}
              onClick={() => setPage(p.id)}
            >
              {p.label}
            </button>
          ))}
        </div>
        <div className="topnav-user">
          <span className="user-avatar">C</span>
          <span className="user-name">Caroline von Konigsmark</span>
          <span className="user-badge">ADMIN</span>
        </div>
      </nav>
      <main className="page">
        {page === 'landing' && <Landing onNavigate={setPage} />}
        {page === 'pulse' && <SecurityPulse />}
        {page === 'catalog' && <AdminCatalog onNavigate={setPage} />}
        {page === 'orchestrator' && (
          <Orchestrator onNavigate={setPage} campaign={campaign} setCampaign={setCampaign} />
        )}
        {page === 'command' && <CommandCentre onNavigate={setPage} campaign={campaign} />}
        {page === 'teams' && <TeamsMock onNavigate={setPage} campaign={campaign} />}
        {page === 'cipher' && <CipherLetter onNavigate={setPage} />}
        {page === 'ampliverse' && <Ampliverse onNavigate={setPage} />}
      </main>
    </div>
  )
}

return App;
})();

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
